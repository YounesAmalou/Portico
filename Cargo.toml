[package]
name = "portico-ssh"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "Keyboard-first terminal UI and CLI for managing OpenSSH hosts without taking over OpenSSH"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YounesAmalou/Portico"
homepage = "https://github.com/YounesAmalou/Portico"
readme = "README.md"
authors = ["Younes A. Amalou (Yousen)"]
keywords = ["ssh", "tui", "openssh", "cli", "config"]
categories = ["command-line-utilities"]
exclude = [
    ".superpowers/",
    ".worktrees/",
    "docs/superpowers/",
    ".github/",
    "packaging/",
    "desktop/",
    "tests/docs.rs",
    "tests/package.rs",
]

[lib]
name = "portico"

[[bin]]
name = "portico"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
glob = "0.3"
libc = "0.2"
ratatui = "0.30"
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"

[dev-dependencies]
portable-pty = "0.9"
# Renders release-plz.toml's pr_body with the Tera major of the pinned release-plz.
tera = { version = "2", default-features = false }
tempfile = "3"
vt100 = "0.17"

[profile.release]
strip = true
