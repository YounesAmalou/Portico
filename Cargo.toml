[package]
name = "portico-ssh"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
description = "Keyboard-first terminal UI and CLI for managing OpenSSH hosts without taking over OpenSSH"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YounesAmalou/Portico"
homepage = "https://github.com/YounesAmalou/Portico"
readme = "README.md"
authors = ["Younes A. Amalou (Yousen)"]
keywords = ["ssh", "tui", "openssh", "cli", "config"]
categories = ["command-line-utilities"]
exclude = [
    ".superpowers/",
    ".worktrees/",
    "docs/superpowers/",
    ".github/",
    "packaging/aur/",
    "packaging/arch/",
    "desktop/quickshell/tests/",
    "desktop/quickshell/preview.png",
    "tests/docs.rs",
    "tests/package.rs",
]

[lib]
name = "portico"

[[bin]]
name = "portico"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
glob = "0.3"
libc = "0.2"
ratatui = "0.30"
serde_json = "1"
signal-hook = "0.4"
thiserror = "2"

[dev-dependencies]
portable-pty = "0.9"
# Renders release-plz.toml's pr_body with the Tera major of the pinned release-plz.
tera = { version = "2", default-features = false }
tempfile = "3"
vt100 = "0.17"

[profile.release]
strip = true

# The release workflow's Linux packages (cargo-deb and cargo-generate-rpm, run with
# --target): the binary is a static musl build, so OpenSSH's client is the only
# dependency. The Arch Linux package installs the same files (packaging/arch/PKGBUILD).
[package.metadata.deb]
name = "portico"
section = "net"
depends = "openssh-client"
assets = [
    ["target/release/portico", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/portico/", "644"],
    ["CHANGELOG.md", "usr/share/doc/portico/", "644"],
    ["LICENSE-MIT", "usr/share/doc/portico/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/portico/", "644"],
    ["packaging/desktop/portico.desktop", "usr/share/applications/", "644"],
    ["packaging/desktop/portico.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "portico"
auto-req = "no"
assets = [
    { source = "target/release/portico", dest = "/usr/bin/portico", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/portico/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/portico/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/portico/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/portico/LICENSE-APACHE", mode = "644", doc = true },
    { source = "packaging/desktop/portico.desktop", dest = "/usr/share/applications/portico.desktop", mode = "644" },
    { source = "packaging/desktop/portico.svg", dest = "/usr/share/icons/hicolor/scalable/apps/portico.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
openssh-clients = "*"
