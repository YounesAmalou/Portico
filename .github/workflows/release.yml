name: Release

# A pushed vX.Y.Z tag verifies, builds, releases and publishes to crates.io, the AUR, the
# Homebrew tap and winget (independent jobs: one failing never blocks or reruns another). A manual run is a
# rehearsal: it verifies, builds, packages, checks and attests every artifact, but never
# creates a release or publishes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check that the tag, Cargo version and changelog agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          scripts/changelog-notes.sh "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md

  # release-plz tags the last commit of its release pull request. Branch protection makes
  # that pull request up to date with main before it merges, so the merge commit pushed to
  # main has the same tree, and CI already checked it there. Wait for that run and reuse
  # it when every job passed; otherwise (a manual run, no such run, a failed, cancelled or
  # partly skipped run) the checks job runs CI in full.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        name: Check whether this tree already passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          repo="repos/$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree=$(gh api "$repo/git/commits/$GITHUB_SHA" --jq .tree.sha)
            for _ in $(seq 60); do
              run=$(gh api "$repo/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=20" --jq \
                "[.workflow_runs[] | select(.head_commit.tree_id == \"$tree\")][0] | \"\(.id) \(.status) \(.conclusion)\"" || true)
              read -r id status conclusion <<< "$run"
              [ -n "$id" ] && [ "$id" != null ] || break
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ] && gh api "$repo/actions/runs/$id/jobs" \
                  --jq '[.jobs[] | select(.conclusion != "success")] | length == 0' | grep -qx true; then
                  passed=true
                  echo "CI run $id passed every job on this tree"
                fi
                break
              fi
              sleep 30
            done
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  checks:
    needs: [verify, ci-passed]
    uses: ./.github/workflows/ci.yml
    with:
      skip: ${{ needs.ci-passed.outputs.passed == 'true' }}

  # Each target's artifacts are built, then attested in the same job: the static musl
  # binary's tarball, the .deb and .rpm, a CycloneDX SBOM and, for x86_64, the Arch Linux
  # package. aarch64 is cross-compiled (scripts/build-release.sh).
  build:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - run: pacman -Syu --noconfirm rustup git cargo-deb cargo-generate-rpm cargo-cyclonedx
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary=$(scripts/build-release.sh "$VERSION" "$TARGET" dist)
          # The SBOM describes the binary, so it is attested for the binary and every
          # archive or package that carries it.
          {
            echo "binary=$binary"
            echo "sbom=dist/portico-v$VERSION-$TARGET.cdx.json"
            echo "carriers<<EOF"
            echo "$binary"
            find dist -type f ! -name '*.cdx.json'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            ${{ steps.build.outputs.binary }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ steps.build.outputs.sbom }}
          subject-path: ${{ steps.build.outputs.carriers }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # The macOS artifacts, built on Apple silicon for both architectures (Intel is
  # cross-compiled): the tray app's tarball (scripts/build-tray.sh), then the binary's tarball
  # and a CycloneDX SBOM, attested in the same job. The binary bakes in the SHA-256 of the
  # tray app's tarball (PORTICO_TRAY_SHA256), which `portico desktop install` checks. The arm64
  # binary and app are run before they are released. The linker signs the binary ad hoc, and
  # build-tray.sh the app; they are not notarized, which Homebrew does not need.
  build-macos:
    needs: [verify, checks]
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo install --locked cargo-cyclonedx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          tray=$(scripts/build-tray.sh "$VERSION" "$TARGET" dist)
          PORTICO_TRAY_SHA256=$(shasum -a 256 "$tray" | cut -d ' ' -f 1)
          export PORTICO_TRAY_SHA256
          binary=$(scripts/build-release.sh "$VERSION" "$TARGET" dist)
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            "$binary" --version | grep -qx "portico $VERSION"
            tar -xzf "$tray" -C "$RUNNER_TEMP"
            codesign --verify --deep --strict "$RUNNER_TEMP/Portico Tray.app"
            "$RUNNER_TEMP/Portico Tray.app/Contents/MacOS/portico-tray" --version |
              grep -qx "portico-tray $VERSION"
          fi
          # The SBOM describes the binary, not the tray app.
          {
            echo "binary=$binary"
            echo "sbom=dist/portico-v$VERSION-$TARGET.cdx.json"
            echo "carriers<<EOF"
            echo "$binary"
            find dist -type f ! -name '*.cdx.json' ! -name 'portico-tray-*'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            ${{ steps.build.outputs.binary }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ steps.build.outputs.sbom }}
          subject-path: ${{ steps.build.outputs.carriers }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # The Windows artifacts, built on a Windows x64 runner for both architectures (arm64 is
  # cross-compiled by the runner's Visual Studio): a zip of the tray app's portico-tray.exe
  # (scripts/build-tray.sh), then a zip of portico.exe and a CycloneDX SBOM, attested in the
  # same job. portico.exe bakes in the SHA-256 of the tray app's zip (PORTICO_TRAY_SHA256),
  # which `portico desktop install` checks. The x64 binary is run before it is packaged. They
  # are not code-signed.
  build-windows:
    needs: [verify, checks]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    defaults:
      run:
        shell: bash
    steps:
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo install --locked cargo-cyclonedx
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          tray=$(scripts/build-tray.sh "$VERSION" "$TARGET" dist)
          PORTICO_TRAY_SHA256=$(sha256sum "$tray" | cut -d ' ' -f 1)
          export PORTICO_TRAY_SHA256
          # The attest action reads Windows paths, not Git for Windows' /d/... ones.
          binary=$(cygpath -m "$(scripts/build-release.sh "$VERSION" "$TARGET" dist)")
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then
            "$binary" --version | grep -qx "portico $VERSION"
          fi
          # The SBOM describes the binary, not the tray app.
          {
            echo "binary=$binary"
            echo "sbom=dist/portico-v$VERSION-$TARGET.cdx.json"
            echo "carriers<<EOF"
            echo "$binary"
            find dist -type f ! -name '*.cdx.json' ! -name 'portico-tray-*'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            ${{ steps.build.outputs.binary }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ steps.build.outputs.sbom }}
          subject-path: ${{ steps.build.outputs.carriers }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # A rehearsal renders the winget manifests of the Windows zips it built and checks them
  # with `winget validate` where the runner has winget. The winget job renders them again
  # for a release.
  winget-manifests:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, build-windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-pc-windows-msvc
          path: dist
          merge-multiple: true
      - name: Render the manifests
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          scripts/winget-manifest.sh "$VERSION" \
            "dist/portico-v$VERSION-x86_64-pc-windows-msvc.zip" \
            "dist/portico-v$VERSION-aarch64-pc-windows-msvc.zip" winget
      - name: Validate the manifests
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            "::notice::winget is not installed on this runner: the manifests were not validated"
            exit 0
          }
          winget validate --manifest winget
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget/*

  # Installs each artifact in a clean container of its distribution and runs it, on the
  # architecture it was built for.
  verify-packages:
    needs: [verify, build]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - run: scripts/verify-packages.sh "${{ needs.verify.outputs.version }}" dist

  checksums:
    needs: [verify-packages, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Portico $GITHUB_REF_NAME" --notes-file notes.md

  crates:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: aur
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/aur-publish.sh "${{ needs.verify.outputs.version }}"
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # Pushes the formula of this release (packaging/homebrew/portico.rb) to the Homebrew tap.
  # It does nothing until the homebrew environment holds HOMEBREW_TAP_TOKEN, a token that
  # can write the tap repository only.
  homebrew:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, release]
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Push the formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set: the Homebrew tap was not updated"
            exit 0
          fi
          scripts/homebrew-formula.sh "$VERSION" dist > portico.rb
          git clone "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$TAP.git" tap
          mkdir -p tap/Formula
          cp portico.rb tap/Formula/portico.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/portico.rb
          if git diff --cached --quiet; then
            echo "The tap already has portico $VERSION"
            exit 0
          fi
          git commit -m "portico $VERSION"
          git push origin HEAD

  # Opens the pull request that adds this release's winget manifests (packaging/winget/) to
  # microsoft/winget-pkgs, from the repository owner's fork of it. It does nothing until the
  # winget environment holds WINGET_TOKEN, a token of the fork's owner that can push to the
  # fork and open pull requests; a version that already has a pull request is left alone.
  winget:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, release]
    runs-on: ubuntu-latest
    environment: winget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Open the pull request to winget-pkgs
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          FORK: ${{ github.repository_owner }}/winget-pkgs
          UPSTREAM: microsoft/winget-pkgs
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set: no pull request was opened to winget-pkgs"
            exit 0
          fi
          export GH_TOKEN=$WINGET_TOKEN
          scripts/winget-manifest.sh "$VERSION" \
            "dist/portico-v$VERSION-x86_64-pc-windows-msvc.zip" \
            "dist/portico-v$VERSION-aarch64-pc-windows-msvc.zip" manifests
          branch="YounesAmalou.Portico-$VERSION"
          title="New version: YounesAmalou.Portico version $VERSION"
          if [ -n "$(gh pr list --repo "$UPSTREAM" --head "$branch" --state all --json url --jq '.[].url')" ]; then
            echo "winget-pkgs already has a pull request for portico $VERSION"
            exit 0
          fi
          # One commit on top of the fork's master, brought level with winget-pkgs first,
          # adds the three manifests where winget-pkgs keeps this version.
          gh api -X POST "repos/$FORK/merge-upstream" -f branch=master > /dev/null
          base=$(gh api "repos/$FORK/git/ref/heads/master" --jq .object.sha)
          dir="manifests/y/YounesAmalou/Portico/$VERSION"
          tree=$(for file in manifests/*.yaml; do
              jq -n --arg path "$dir/${file#manifests/}" --rawfile content "$file" \
                '{path: $path, mode: "100644", type: "blob", content: $content}'
            done | jq -s --arg base "$base" '{base_tree: $base, tree: .}' |
            gh api -X POST "repos/$FORK/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg message "$title" --arg tree "$tree" --arg base "$base" \
              '{message: $message, tree: $tree, parents: [$base]}' |
            gh api -X POST "repos/$FORK/git/commits" --input - --jq .sha)
          if gh api "repos/$FORK/git/ref/heads/$branch" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$FORK/git/refs/heads/$branch" -f "sha=$commit" -F force=true > /dev/null
          else
            gh api -X POST "repos/$FORK/git/refs" -f "ref=refs/heads/$branch" -f "sha=$commit" > /dev/null
          fi
          gh pr create --repo "$UPSTREAM" --base master --head "${FORK%%/*}:$branch" --title "$title" \
            --body "Portico $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
