name: Release

# A pushed vX.Y.Z tag verifies, builds, releases and publishes to crates.io and the AUR
# (independent jobs: one failing never blocks or reruns the other). A manual run is a
# rehearsal: it verifies, builds, packages, checks and attests every artifact, but never
# creates a release or publishes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Check that the tag, Cargo version and changelog agree
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
            exit 1
          fi
          scripts/changelog-notes.sh "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md

  # release-plz tags the last commit of its release pull request. Branch protection makes
  # that pull request up to date with main before it merges, so the merge commit pushed to
  # main has the same tree, and CI already checked it there. Wait for that run and reuse
  # it when every job passed; otherwise (a manual run, no such run, a failed, cancelled or
  # partly skipped run) the checks job runs CI in full.
  ci-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        name: Check whether this tree already passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          repo="repos/$GITHUB_REPOSITORY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tree=$(gh api "$repo/git/commits/$GITHUB_SHA" --jq .tree.sha)
            for _ in $(seq 60); do
              run=$(gh api "$repo/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=20" --jq \
                "[.workflow_runs[] | select(.head_commit.tree_id == \"$tree\")][0] | \"\(.id) \(.status) \(.conclusion)\"" || true)
              read -r id status conclusion <<< "$run"
              [ -n "$id" ] && [ "$id" != null ] || break
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ] && gh api "$repo/actions/runs/$id/jobs" \
                  --jq '[.jobs[] | select(.conclusion != "success")] | length == 0' | grep -qx true; then
                  passed=true
                  echo "CI run $id passed every job on this tree"
                fi
                break
              fi
              sleep 30
            done
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  checks:
    needs: [verify, ci-passed]
    uses: ./.github/workflows/ci.yml
    with:
      skip: ${{ needs.ci-passed.outputs.passed == 'true' }}

  # Each target's artifacts are built, then attested in the same job: the static musl
  # binary's tarball, the .deb and .rpm, a CycloneDX SBOM and, for x86_64, the Arch Linux
  # package. aarch64 is cross-compiled (scripts/build-release.sh).
  build:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - run: pacman -Syu --noconfirm rustup git cargo-deb cargo-generate-rpm cargo-cyclonedx
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: build
        name: Build and package
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary=$(scripts/build-release.sh "$VERSION" "$TARGET" dist)
          # The SBOM describes the binary, so it is attested for the binary and every
          # archive or package that carries it.
          {
            echo "binary=$binary"
            echo "sbom=dist/portico-v$VERSION-$TARGET.cdx.json"
            echo "carriers<<EOF"
            echo "$binary"
            find dist -type f ! -name '*.cdx.json'
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*
            ${{ steps.build.outputs.binary }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{ steps.build.outputs.sbom }}
          subject-path: ${{ steps.build.outputs.carriers }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  # Installs each artifact in a clean container of its distribution and runs it, on the
  # architecture it was built for.
  verify-packages:
    needs: [verify, build]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - run: scripts/verify-packages.sh "${{ needs.verify.outputs.version }}" dist

  checksums:
    needs: verify-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/*

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Portico $GITHUB_REF_NAME" --notes-file notes.md

  crates:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: crates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  aur:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    environment: aur
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/aur-publish.sh "${{ needs.verify.outputs.version }}"
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
