name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories change without any change here: re-check the dependencies every day.
    - cron: "23 4 * * *"
  workflow_call:
    inputs:
      skip:
        description: Report success without running the checks (the commit already passed them on main)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Root restores the build cache into these and ci-container.sh hands them to the
  # unprivileged user that builds, so both see the same registry and toolchains.
  CARGO_HOME: /opt/cargo
  RUSTUP_HOME: /opt/rustup

# Every job reports on every pull request: a job whose work a change cannot affect is
# skipped, which counts as passing. If `changes` fails, its outputs are empty and every
# job runs.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      deps: ${{ steps.filter.outputs.deps }}
      desktop: ${{ steps.filter.outputs.desktop }}
      tray: ${{ steps.filter.outputs.tray }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Decide which checks the change needs
        env:
          SKIP: ${{ inputs.skip }}
          BEFORE: ${{ github.event.before }}
        run: |
          # rust: anything but documentation changed; docs: documentation changed (the
          # doc guards in tests/docs.rs read it); deps: the dependencies or their checks
          # changed. Without a diff to inspect (a release, a new branch), run everything.
          # desktop: the desktop panel or what it is tested against changed; it is only
          # ever set by a diff, so the optional desktop check never runs for a release.
          # tray: the tray app, what its tests read or how it is built and released changed.
          rust=true docs=true deps=true desktop=false tray=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            *) base= ;;
          esac
          if [ "$SKIP" = true ]; then
            rust=false docs=false deps=false tray=false
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            rust=false docs=false tray=false
          elif [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            rust=false docs=false deps=false tray=false
            while read -r file; do
              case "$file" in
                "") ;;
                # The tray app is its own Cargo project, outside Portico's crate; the doc
                # guards may read its documentation.
                desktop/tray/*) docs=true ;;
                # The binary embeds the panel's files, and the doc guards read them.
                desktop/*) rust=true docs=true ;;
                *.md | docs/*) docs=true ;;
                *) rust=true ;;
              esac
              case "$file" in
                desktop/quickshell/* | tests/fixtures/json/* | docs/json-output.md | scripts/ci-checks.sh) desktop=true ;;
              esac
              case "$file" in
                desktop/tray/* | tests/fixtures/json/* | scripts/build-tray.sh | scripts/ci-*.sh | deny.toml | .github/workflows/*) tray=true ;;
              esac
              case "$file" in
                Cargo.toml | Cargo.lock | desktop/tray/Cargo.toml | desktop/tray/Cargo.lock | deny.toml | .github/workflows/ci.yml | scripts/ci-*.sh) deps=true ;;
              esac
            done <<< "$files"
          fi
          echo "rust=$rust docs=$docs deps=$deps desktop=$desktop tray=$tray"
          { echo "rust=$rust"; echo "docs=$docs"; echo "deps=$deps"; echo "desktop=$desktop"; echo "tray=$tray"; } >> "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-container.sh fmt

  clippy:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci-container.sh clippy

  test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.rust != 'false' || needs.changes.outputs.docs != 'false') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A documentation-only change runs just the doc guards.
      - run: scripts/ci-container.sh ${{ needs.changes.outputs.rust == 'false' && 'docs' || 'test' }}

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The real binary against a real sshd, through a real pseudo-terminal.
      - run: scripts/ci-container.sh e2e

  # The same Rust checks on macOS (Apple silicon), as the runner's own unprivileged user:
  # clippy for the macOS code, the tests, and the end-to-end suite against macOS's own
  # OpenSSH. Each check is its own job, as on Linux, so one failing never hides another.
  # The workflow's CARGO_HOME and RUSTUP_HOME are the Linux container's, so the runner's
  # own are named here. A normal run takes a few minutes; the limit makes a hung test fail
  # quickly, with the log of what was running, instead of after GitHub's six hours.
  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test, e2e]
    env:
      CARGO_HOME: /Users/runner/.cargo
      RUSTUP_HOME: /Users/runner/.rustup
    steps:
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci-checks.sh ${{ matrix.check }}
        timeout-minutes: 12

  # The same Rust checks on Windows, as the runner's own user, in Git for Windows' bash (which
  # also runs the tests' shell-script fakes): clippy for the Windows code, the tests, and the
  # end-to-end suite against Windows' own OpenSSH server, whose capability `e2e` adds first
  # where the image lacks it. The workflow's CARGO_HOME and RUSTUP_HOME are the Linux
  # container's, so the runner's own are named here. The limits make a hung test fail with the
  # log of what was running, instead of after GitHub's six hours.
  windows:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test, e2e]
    env:
      CARGO_HOME: C:\Users\runneradmin\.cargo
      RUSTUP_HOME: C:\Users\runneradmin\.rustup
    defaults:
      run:
        shell: bash
    steps:
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Add the OpenSSH server
        if: ${{ matrix.check == 'e2e' }}
        shell: pwsh
        run: |
          if (-not (Test-Path C:\Windows\System32\OpenSSH\sshd.exe)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Host
          }
      - run: scripts/ci-checks.sh ${{ matrix.check }}
        timeout-minutes: 20

  msrv:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci-container.sh msrv

  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deps != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python cargo-audit
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-container.sh audit

  deny:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.deps != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python cargo-deny
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-container.sh deny

  package:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git openssh python
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/ci-container.sh package

  # The tray app (desktop/tray, its own Cargo project) on Linux, as the other Linux checks run:
  # fmt, clippy and its tests, which build its pure menu model and read the golden files. The
  # tray jobs always run, and their steps only when `changes` says the tray needs them, because
  # a skipped job would keep the release workflow from reusing a run on main.
  tray:
    name: tray (linux)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - if: ${{ needs.changes.outputs.tray != 'false' }}
        run: pacman -Syu --noconfirm rustup git openssh python
      - if: ${{ needs.changes.outputs.tray != 'false' }}
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.tray != 'false' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ needs.changes.outputs.tray != 'false' }}
        with:
          workspaces: desktop/tray
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ needs.changes.outputs.tray != 'false' }}
        run: scripts/ci-container.sh tray

  # The tray app on macOS (Apple silicon) and Windows (x64), as the runners' own users: clippy
  # for the native menu and event loop, which Linux cannot build, then the archive the release
  # ships, built by scripts/build-tray.sh. Footprint: the job fails when that archive is larger
  # than 4 MiB (4194304 bytes), about the size of `portico`'s own archive of the same target;
  # the app is expected at 1-2 MB. On macOS the packaged app's signature and version are
  # checked too. Its steps run only when the tray needs them, as for the Linux job.
  tray-native:
    name: ${{ matrix.system }} (tray)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macos
            runner: macos-latest
            cargo-home: /Users/runner/.cargo
            rustup-home: /Users/runner/.rustup
          - system: windows
            runner: windows-latest
            cargo-home: C:\Users\runneradmin\.cargo
            rustup-home: C:\Users\runneradmin\.rustup
    env:
      CARGO_HOME: ${{ matrix.cargo-home }}
      RUSTUP_HOME: ${{ matrix.rustup-home }}
    defaults:
      run:
        shell: bash
    steps:
      - if: ${{ needs.changes.outputs.tray != 'false' }}
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.tray != 'false' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ needs.changes.outputs.tray != 'false' }}
        with:
          workspaces: desktop/tray
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        if: ${{ needs.changes.outputs.tray != 'false' }}
        working-directory: desktop/tray
        run: cargo clippy --all-targets --locked -- -D warnings
      - id: build
        name: Build and package
        if: ${{ needs.changes.outputs.tray != 'false' }}
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          echo "archive=$(scripts/build-tray.sh 0.0.0 "$target" dist)" >> "$GITHUB_OUTPUT"
      - name: Check the app's signature and version
        if: ${{ needs.changes.outputs.tray != 'false' && matrix.system == 'macos' }}
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          app="$RUNNER_TEMP/Portico Tray.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/portico-tray" --version | grep -qx "portico-tray 0.0.0"
      - name: Check the footprint
        if: ${{ needs.changes.outputs.tray != 'false' }}
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          size=$(wc -c < "$ARCHIVE" | tr -d ' ')
          limit=$((4 * 1024 * 1024))
          echo "$(basename "$ARCHIVE"): $size bytes (limit $limit)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::the tray archive is $size bytes, over the $limit-byte limit"
            exit 1
          fi

  # Optional: not a required check, and no job depends on it. It lints the desktop panel
  # and tests its JSON parsing against the golden files. The job always runs, and its
  # steps only when the panel or what it reads changed, because a skipped job would keep
  # the release workflow from reusing this run; continue-on-error keeps a failure from
  # failing the workflow.
  desktop:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.desktop == 'true' }}
      - name: Lint the panel and test portico.js
        if: ${{ needs.changes.outputs.desktop == 'true' }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -c \
            'pacman -Syu --noconfirm qt6-declarative quickshell && scripts/ci-checks.sh desktop'
